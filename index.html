<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Courses</title><meta http-equiv="refresh" content="0;url=/carnet-repas/"></head>
<body style="font-family:system-ui,sans-serif;padding:24px">
<p>La liste de courses est maintenant dans Carnet repas : <a href="/carnet-repas/">ouvrir Carnet repas</a>.</p>
<script>
if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>{ if (r.scope.endsWith("/Courses/")) r.unregister(); })).catch(()=>{});
try{ localStorage.setItem("tab","courses"); }catch(_){}
location.replace("/carnet-repas/");
</script></body></html>
