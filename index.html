<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Courses d'Antoine</title>
<meta name="theme-color" content="#B4532A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;700&display=swap">
<style>
html{padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}
/* Même charte que Carnet repas, accent terre cuite pour distinguer les deux applis. */
:root{
  --bg:#F3EFEC; --surface:#FFFFFF; --ink:#231A16; --muted:#6B605B; --line:#DED5D0;
  --accent:#B4532A; --accent-ink:#FFFFFF; --soft:#F6E2D8;
  --menu:#1F6F4A; --menu-bg:#E1F0E2;
  --done:#A69B96;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16110F; --surface:#221A17; --ink:#F0E8E4; --muted:#AFA19A; --line:#3A2E29;
  --accent:#EE9A72; --accent-ink:#1E0F08; --soft:#3E2519; --menu:#7FD18A; --menu-bg:#1D3322; --done:#6E625D; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#16110F; --surface:#221A17; --ink:#F0E8E4; --muted:#AFA19A; --line:#3A2E29;
  --accent:#EE9A72; --accent-ink:#1E0F08; --soft:#3E2519; --menu:#7FD18A; --menu-bg:#1D3322; --done:#6E625D; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(32px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:800;font-size:1.5rem;margin:0;letter-spacing:-.01em}
.sync{font-size:.75rem;color:var(--muted)}
main{display:flex;flex-direction:column;gap:14px;padding-top:4px}
h2{font-family:var(--f-display);font-weight:700;font-size:1.2rem;margin:8px 0 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sub{color:var(--muted);font-size:.9rem;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h3{font-family:var(--f-display);font-size:.95rem;margin:0 0 4px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.progress{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .2s}
.count{font-variant-numeric:tabular-nums;font-size:.85rem;color:var(--muted)}
.add form{display:flex;gap:8px}
.add input{font:inherit;flex:1;min-width:0;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.cat{font:inherit;font-size:.8rem;font-weight:700;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:99px;padding:6px 12px;cursor:pointer}
.cat[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.habs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.habs .lbl{font-size:.75rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;width:100%}
.hab{font:inherit;font-size:.85rem;border:1px dashed var(--accent);background:var(--soft);color:var(--ink);border-radius:99px;padding:5px 11px;cursor:pointer}
.hab.edit{border-style:solid;border-color:var(--line);background:transparent;color:var(--muted)}
.linkbtn{font:inherit;font-size:.78rem;border:0;background:transparent;color:var(--accent);font-weight:700;cursor:pointer;padding:4px 6px}
.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);cursor:pointer;min-height:52px}
.row:first-of-type{border-top:0}
.row .lbl{flex:1;min-width:0}
.row.is-done .lbl{color:var(--done);text-decoration:line-through}
.tick{flex:none;width:30px;height:30px;border-radius:9px;border:2px solid var(--line);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0;color:var(--accent-ink)}
.tick[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.tick svg{width:16px;height:16px;opacity:0}
.tick[aria-checked="true"] svg{opacity:1}
.mini{font:inherit;font-size:.75rem;font-weight:700;border:1px solid var(--line);background:transparent;color:var(--accent);border-radius:99px;padding:4px 10px;cursor:pointer;flex:none}
.x{font:inherit;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:1.3rem;line-height:1;padding:4px 8px;border-radius:8px;flex:none}
.tag{font-size:.7rem;font-weight:700;border-radius:99px;padding:2px 9px;background:var(--menu-bg);color:var(--menu);letter-spacing:.02em}
.weeknav{display:flex;align-items:center;gap:6px;margin-left:auto}
.weeknav button{font:inherit;width:34px;height:34px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;cursor:pointer}
.weeknav button:disabled{opacity:.35;cursor:default}
.weeknav span{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-size:.88rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 13px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.warn{border-color:var(--accent);color:var(--accent);font-weight:700}
.empty{text-align:center;padding:22px 16px;color:var(--muted)}
.empty b{display:block;font-family:var(--f-display);color:var(--ink);font-size:1.05rem;margin-bottom:4px}
.note{font-size:.85rem;color:var(--muted);margin:0}
.swap{background:var(--menu-bg);color:var(--menu);border-radius:4px;padding:0 3px}
.placard{list-style:none;margin:6px 0 0;padding:0}
.placard li{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:.9rem;color:var(--muted)}
.placard li:first-child{border-top:0}
.placard li .lbl{flex:1}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.88rem;z-index:20;max-width:calc(100% - 32px)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head><body>
<div class="wrap">
  <header>
    <div class="brand"><h1>Courses</h1><span class="sync" id="sync">Chargement…</span></div>
    <div class="progress"><div class="bar"><i id="pbar" style="width:0%"></i></div><span class="count" id="pcount">0 / 0</span></div>
  </header>
  <main>
    <section class="card add">
      <form id="add-form" autocomplete="off">
        <input id="add-txt" type="text" placeholder="Ajouter : lessive, shampoing, pain…" aria-label="Article à ajouter" enterkeyhint="done">
        <button class="btn primary" type="submit">Ajouter</button>
      </form>
      <div class="cats" id="cats" role="group" aria-label="Catégorie"></div>
      <div class="habs" id="habs"></div>
    </section>
    <div id="view"></div>
  </main>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
const CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';
const CATS = [["alim","Alimentaire"],["entretien","Entretien"],["beaute","Hygiène & beauté"],["maison","Maison"],["autre","Autre"]];
const CAT_LBL = Object.fromEntries(CATS);
// Clés partagées avec Carnet repas (même adresse, donc même mémoire du téléphone).
const LS="carnet-suivi", PK="carnet-placard", GK="carnet-gouts", DK="carnet-data";
// Clés propres à l'appli Courses.
const MK="courses-perso", HK="courses-habituels";

function load(k, def){ try{ const v=localStorage.getItem(k); return v ? JSON.parse(v) : def; }catch(_){ return def; } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(_){ setSync("Pas enregistré : mémoire du téléphone indisponible."); } }

const state = { weeks:[], week:null, cat:"alim", editHab:false, showAllHab:false, panier:false, confirm:false, ready:false };
try{ state.cat = localStorage.getItem("courses-cat") || "alim"; }catch(_){}
let PERSO=[], HAB={}, SUIVI={}, PLACARD={}, GOUTS=[];
function reload(){ PERSO=load(MK,[]); HAB=load(HK,{}); SUIVI=load(LS,{}); PLACARD=load(PK,{}); GOUTS=load(GK,[]); }
reload();

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function addDays(isoStr, n){ const [y,m,d]=isoStr.split("-").map(Number); return new Date(y,m-1,d+n); }
const fmtShort = dt => dt.toLocaleDateString("fr-FR",{day:"numeric",month:"short"}).replace(".","");
function setSync(t){ document.getElementById("sync").textContent = t; }
function toast(t){ const el=document.getElementById("toast"); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true, 2200); }

// Mêmes règles que Carnet repas : nom d'aliment sans quantité (pour « J'en ai ») et remplacement des aliments refusés.
const ACC = {a:"aàâä",e:"eéèêë",i:"iîï",o:"oôöœ",u:"uùûü",c:"cç"};
function norm(x){ return x.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/œ/g,"oe").trim(); }
function aliment(label){
  return norm(label.replace(/\([^)]*\)/g,"")).replace(/^[\d,.\s]+(kg|g|l|cl|ml)?\s+/,"").replace(/^(petite?s?|grosse?s?)\s+/,"")
    .replace(/^(pots?|sachets?|boites?|bocal|bocaux|briques?|paquets?|barquettes?|tetes?|tranches?|filets?|paves?)\s+/,"").replace(/^(de\s+|d['’])/,"").replace(/s$/,"").trim();
}
function pattern(word){
  let w = norm(word).replace(/(es|s|x)$/,"");
  const body = [...w].map(ch => ACC[ch] ? "["+ACC[ch]+ACC[ch].toUpperCase()+"]" : ch.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("").replace(/\s+/g,"\\s+").replace(/\[oôöœOÔÖŒ\]\[eéèêëEÉÈÊË\]/g,"(?:oe|œ|Œ)");
  return new RegExp("(^|[^\\p{L}])("+body+"(?:es|s|x)?)(?![\\p{L}])","giu");
}
function adapt(text, html=true){
  let out = html ? esc(text) : text;
  for (const g of GOUTS){
    if (!g.r) continue;
    const re = pattern(g.a);
    out = out.replace(re, (m,pre)=>pre+(html ? '<span class="swap">'+esc(g.r)+'</span>' : g.r));
  }
  return out;
}

function currentWeekId(){
  const today = iso(new Date());
  for (const w of state.weeks){ if (w.debut && today>=w.debut && today<=iso(addDays(w.debut,6))) return w.id; }
  const futur = state.weeks.find(w => w.debut && w.debut>today);
  return futur ? futur.id : (state.weeks.length ? state.weeks[state.weeks.length-1].id : null);
}
function semaine(){ return state.weeks.find(w=>w.id===state.week) || null; }
function coches(w){ return (SUIVI[w.id]||{}).coches || {}; }

function setCoche(w, id, on){
  SUIVI = load(LS,{});                          // relire avant d'écrire : Carnet repas a pu changer autre chose
  const cur = SUIVI[w.id] || (SUIVI[w.id]={});
  cur.coches = Object.assign({}, cur.coches, {[id]:on});
  save(LS, SUIVI);
}
function retenir(label, cat){
  const k = norm(label); const h = HAB[k] || {label, cat, n:0};
  HAB[k] = {label, cat, n:h.n+1}; save(HK, HAB);
}
function ajouter(label, cat){
  label = label.trim().replace(/\s+/g," "); if (!label) return;
  PERSO = load(MK,[]);
  const deja = PERSO.find(p=>norm(p.label)===norm(label));
  if (deja){ if (deja.done){ deja.done=false; save(MK,PERSO); toast("Remis sur la liste : "+deja.label); } else toast("Déjà sur la liste : "+deja.label); return; }
  PERSO.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6), label, cat, done:false});
  save(MK, PERSO); retenir(label, cat);
}

// Toutes les lignes de la liste : mes ajouts + courses du menu de la semaine choisie.
function lignes(){
  const out = [];
  for (const p of PERSO) out.push({key:"p:"+p.id, label:p.label, html:esc(p.label), group:p.cat, done:!!p.done, perso:true});
  const w = semaine();
  if (w){
    const c = coches(w);
    for (const r of (w.courses||[])) for (const i of (r.items||[])){
      if (PLACARD[aliment(i.label)]) continue;
      out.push({key:"m:"+i.id, id:i.id, label:adapt(i.label,false), html:adapt(i.label), raw:i.label, group:r.rayon, done:!!c[i.id], menu:true});
    }
  }
  return out;
}

function rowHtml(l){
  return `<div class="row ${l.done?"is-done":""}" data-k="${esc(l.key)}"><button class="tick" role="checkbox" aria-checked="${l.done}" aria-label="${esc(l.label)}">${CHECK}</button><span class="lbl">${l.html}</span>${
    l.perso ? `<button class="x" data-del="${esc(l.key)}" aria-label="Retirer ${esc(l.label)}">×</button>`
            : `<button class="mini" data-placard="${esc(l.raw)}" aria-label="J'en ai déjà : ${esc(l.label)}">J'en ai</button>`}</div>`;
}

function renderAdd(){
  document.getElementById("cats").innerHTML = CATS.map(([k,n])=>`<button type="button" class="cat" data-cat="${k}" aria-pressed="${state.cat===k}">${n}</button>`).join("");
  const q = norm(document.getElementById("add-txt").value||"");
  const surListe = new Set(PERSO.filter(p=>!p.done).map(p=>norm(p.label)));
  let habs = Object.entries(HAB).filter(([k])=>!surListe.has(k) && (!q || k.includes(q))).sort((a,b)=>b[1].n-a[1].n || a[1].label.localeCompare(b[1].label));
  const total = habs.length;
  if (!state.showAllHab && !q) habs = habs.slice(0,10);
  const el = document.getElementById("habs");
  if (!total){ el.innerHTML = Object.keys(HAB).length || q ? "" : `<span class="note">Ce que tu ajoutes est retenu ici : la prochaine fois, un seul geste pour le remettre.</span>`; return; }
  el.innerHTML = `<span class="lbl">${q?"Déjà acheté":"Mes habituels"} · touche pour ${state.editHab?"oublier":"ajouter"}</span>`
    + habs.map(([k,h])=>`<button type="button" class="hab ${state.editHab?"edit":""}" data-hab="${esc(k)}">${state.editHab?"× ":"+ "}${esc(h.label)}</button>`).join("")
    + (!q && total>10 ? `<button type="button" class="linkbtn" id="hab-all">${state.showAllHab?"Moins":"Tout voir ("+total+")"}</button>` : "")
    + `<button type="button" class="linkbtn" id="hab-edit">${state.editHab?"Terminé":"Modifier"}</button>`;
}

function render(){
  renderAdd();
  const v = document.getElementById("view");
  if (!state.ready){ v.innerHTML = `<div class="card empty"><b>Ta liste se charge</b>Les courses de ton menu arrivent dans un instant.</div>`; return; }
  const all = lignes(), todo = all.filter(l=>!l.done), done = all.filter(l=>l.done);
  document.getElementById("pbar").style.width = (all.length ? Math.round(100*done.length/all.length) : 0)+"%";
  document.getElementById("pcount").textContent = done.length+" / "+all.length;

  const persoTodo = todo.filter(l=>l.perso);
  const blocsPerso = CATS.map(([k,n])=>{ const it = persoTodo.filter(l=>l.group===k); return it.length ? `<section class="card"><h3>${n}</h3>${it.map(rowHtml).join("")}</section>` : ""; }).join("");

  const w = semaine(), wi = state.weeks.findIndex(x=>x.id===state.week);
  const range = w && w.debut ? fmtShort(addDays(w.debut,0))+" – "+fmtShort(addDays(w.debut,6)) : "";
  const menuTodo = todo.filter(l=>l.menu), rayons = [];
  for (const l of menuTodo){ let r = rayons.find(x=>x.n===l.group); if (!r) rayons.push(r={n:l.group, it:[]}); r.it.push(l); }
  const stock = w ? (w.courses||[]).flatMap(r=>r.items||[]).filter(i=>PLACARD[aliment(i.label)]) : [];

  v.innerHTML = `
    <h2>Mes ajouts</h2>
    ${blocsPerso || `<p class="sub">Rien pour l'instant. Tape un article au-dessus et choisis sa catégorie.</p>`}
    <h2>Pour les menus <span class="tag">Carnet repas</span>
      <span class="weeknav"><button id="wk-prev" aria-label="Semaine précédente" ${wi<=0?"disabled":""}>‹</button><span>${esc(w ? (w.court||"Semaine "+w.num) : "")}${range?" · "+range:""}</span><button id="wk-next" aria-label="Semaine suivante" ${wi<0||wi>=state.weeks.length-1?"disabled":""}>›</button></span></h2>
    ${!w ? `<p class="sub">Pas encore de menu disponible.</p>` : rayons.length ? rayons.map(r=>`<section class="card"><h3>${esc(r.n)}</h3>${r.it.map(rowHtml).join("")}</section>`).join("")
         : `<div class="card empty"><b>Tout est dans le panier</b>Les courses du menu de cette semaine sont faites.</div>`}
    ${stock.length ? `<section class="card"><h3>Déjà dans le placard (${stock.length})</h3><ul class="placard">${stock.map(i=>`<li><span class="lbl">${adapt(i.label)}</span><button class="mini" data-unplacard="${esc(i.label)}">Remettre</button></li>`).join("")}</ul></section>` : ""}
    ${done.length ? `<section class="card"><h3 style="display:flex;justify-content:space-between;align-items:center">Dans le panier (${done.length})<button class="linkbtn" id="panier">${state.panier?"Masquer":"Afficher"}</button></h3>${state.panier ? done.map(rowHtml).join("") : ""}</section>` : ""}
    <div class="tools">
      <button class="btn" id="share">Partager la liste</button>
      ${done.some(l=>l.perso) ? (state.confirm
        ? `<button class="btn warn" id="vider-oui">Oui, vider</button><button class="btn" id="vider-non">Annuler</button>`
        : `<button class="btn" id="vider">Vider le panier</button>`) : ""}
    </div>
    ${state.confirm ? `<p class="note">Retire de la liste tes ajouts cochés. Ils restent dans « Mes habituels ». Les articles du menu restent cochés pour la semaine.</p>` : ""}
    <p class="note">Les coches et « J'en ai » sont partagés avec Carnet repas, dans les deux sens.</p>`;
}

function texteListe(){
  const todo = lignes().filter(l=>!l.done); const blocs = [];
  for (const l of todo){ const g = l.perso ? CAT_LBL[l.group] : l.group; let b = blocs.find(x=>x.g===g); if (!b) blocs.push(b={g, it:[]}); b.it.push(l.label); }
  return "Liste de courses\n" + blocs.map(b=>"\n"+b.g+"\n"+b.it.map(x=>"- "+x).join("\n")).join("\n");
}

document.addEventListener("click", e=>{
  const t = e.target.closest("button, .row"); if (!t) return;
  if (t.dataset.cat){ state.cat=t.dataset.cat; try{localStorage.setItem("courses-cat",state.cat)}catch(_){} renderAdd(); return; }
  if (t.dataset.hab){
    const k=t.dataset.hab, h=HAB[k]; if (!h) return;
    if (state.editHab){ delete HAB[k]; save(HK,HAB); }
    else { ajouter(h.label, h.cat); document.getElementById("add-txt").value=""; }
    render(); return;
  }
  if (t.id==="hab-edit"){ state.editHab=!state.editHab; renderAdd(); return; }
  if (t.id==="hab-all"){ state.showAllHab=!state.showAllHab; renderAdd(); return; }
  if (t.dataset.del){ PERSO=load(MK,[]).filter(p=>"p:"+p.id!==t.dataset.del); save(MK,PERSO); render(); return; }
  if (t.dataset.placard){ PLACARD=load(PK,{}); PLACARD[aliment(t.dataset.placard)]=true; save(PK,PLACARD); render(); toast("Retiré : tu en as déjà"); return; }
  if (t.dataset.unplacard){ PLACARD=load(PK,{}); delete PLACARD[aliment(t.dataset.unplacard)]; save(PK,PLACARD); render(); return; }
  if (t.id==="wk-prev" || t.id==="wk-next"){ const i=state.weeks.findIndex(x=>x.id===state.week)+(t.id==="wk-next"?1:-1); if (state.weeks[i]) state.week=state.weeks[i].id; render(); return; }
  if (t.id==="panier"){ state.panier=!state.panier; render(); return; }
  if (t.id==="vider"){ state.confirm=true; render(); return; }
  if (t.id==="vider-non"){ state.confirm=false; render(); return; }
  if (t.id==="vider-oui"){ state.confirm=false; PERSO=load(MK,[]).filter(p=>!p.done); save(MK,PERSO); render(); toast("Panier vidé"); return; }
  if (t.id==="share"){
    const txt = texteListe();
    if (navigator.share){ navigator.share({title:"Liste de courses", text:txt}).catch(()=>{}); }
    else { try{ navigator.clipboard.writeText(txt).then(()=>toast("Liste copiée"), ()=>toast("Copie impossible")); }catch(_){ toast("Copie impossible"); } }
    return;
  }
  const row = e.target.closest(".row"); if (!row) return;
  const k = row.dataset.k;
  if (k.startsWith("p:")){ PERSO=load(MK,[]); const p=PERSO.find(x=>"p:"+x.id===k); if (p){ p.done=!p.done; save(MK,PERSO); } }
  else { const w=semaine(); if (w){ const id=k.slice(2); setCoche(w, id, !coches(w)[id]); } }
  render();
});
document.addEventListener("submit", e=>{
  if (e.target.id!=="add-form") return;
  e.preventDefault();
  const inp = document.getElementById("add-txt"), txt = inp.value.trim(); if (!txt) return;
  const h = HAB[norm(txt)];
  ajouter(h ? h.label : txt, h ? h.cat : state.cat);
  inp.value=""; render(); inp.focus();
});
document.addEventListener("input", e=>{ if (e.target.id==="add-txt") renderAdd(); });

// Liaison en direct : quand Carnet repas change quelque chose, on relit la mémoire.
window.addEventListener("storage", e=>{
  if (e.key===DK){ try{ applyData(JSON.parse(e.newValue)); }catch(_){} return; }
  reload(); render();
});
document.addEventListener("visibilitychange", ()=>{ if (!document.hidden){ reload(); render(); } });

function applyData(d){
  state.weeks = (d.semaines||[]).slice().sort((a,b)=>(a.num||0)-(b.num||0));
  if (!state.ready || !semaine()){ state.week = currentWeekId(); }
  state.ready = true; render();
}
render();
(async ()=>{
  const c = load(DK, null); if (c){ applyData(c); setSync("Hors ligne"); }
  try{
    const r = await fetch("/carnet-repas/data.json",{cache:"no-cache"}); const d = await r.json();
    try{ localStorage.setItem(DK, JSON.stringify(d)); }catch(_){}
    applyData(d); setSync("À jour");
  }catch(_){ if (!state.ready){ state.ready=true; render(); } setSync("Hors ligne"); }
})();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
